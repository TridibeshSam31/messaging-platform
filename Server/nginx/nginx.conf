# Phase 4 — local load balancer in front of two server instances (WS-1, WS-2)
#
# Browser ──► nginx :8080 ──► WS-1 :5000  ┐
#                       └──► WS-2 :5001  ┴──► Redis + PostgreSQL
#
# Run (from the Server folder, PowerShell):
#   docker run --rm -p 8080:8080 -v "${PWD}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx

events {}

http {
    # the pool of servers nginx can send a connection to.
    # host.docker.internal = "the Windows machine running Docker", where npm run dev listens
    upstream chat_servers {
        # default strategy is round-robin: 1st connection → WS-1, 2nd → WS-2, 3rd → WS-1 ...
        # if one server is down, nginx skips it and uses the other (graceful failover)
        server host.docker.internal:5000;
        server host.docker.internal:5001;
    }

    # a WebSocket starts as a normal HTTP request with "Upgrade: websocket".
    # nginx does NOT forward that by default, so we copy it through ourselves:
    # client asked to upgrade → send "Connection: upgrade", otherwise a normal close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://chat_servers;

            # WebSocket upgrade needs HTTP/1.1 + these two headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # pass the original host and the real client IP to Express
            # (the IP is used by the rate limiter when TRUST_PROXY=true)
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # nginx closes connections that are silent for 60s by default.
            # Our heartbeat pings every 30s, so 120s leaves plenty of margin.
            proxy_read_timeout 120s;
        }
    }
}
